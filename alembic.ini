# Alembic configuration for ecom-be.
#
# The database URL is intentionally NOT configured here. `alembic/env.py` reads
# it from the validated application settings (`DATABASE_URL`), so no connection
# string or credential is stored in a tracked file.

[alembic]
# Path to the migration scripts, relative to the directory holding this file.
script_location = alembic

# Prepend the project root so `app` is importable by `env.py`.
prepend_sys_path = .

# Use the operating system path separator for multi-path options.
path_separator = os

# No `sqlalchemy.url` value: `env.py` sets it from the application settings.
# Leaving it unset documents that this file holds no database coordinates.

# Logging configuration consumed by `env.py` via `fileConfig`.
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
